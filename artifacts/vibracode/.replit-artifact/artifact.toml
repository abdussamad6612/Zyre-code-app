kind = "web"
previewPath = "/"
title = "VibraCode - AI Mobile App Builder"
version = "1.0.0"
id = "artifacts/vibracode"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21857

[services.development]
run = "pnpm --filter @workspace/vibracode run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vibracode", "run", "build" ]
publicDir = "artifacts/vibracode/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21857"
BASE_PATH = "/"
